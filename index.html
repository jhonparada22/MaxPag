<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxJhon22</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Pantalla de inicio de sesión -->
  <section class="screen" id="login-screen">
    <div class="login-card">
      <div class="avatar-ring">
        <img src="assets/perfil.png" alt="Perfil" class="avatar">
      </div>
      <p class="username">MaxJhon22</p>
      <button class="login-btn" id="loginBtn">
        <span>Iniciar sesión</span>
        <svg viewBox="0 0 24 24" class="btn-arrow">
          <path d="M13 5l7 7-7 7M5 12h15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- Pantalla de carga (boot) -->
  <section class="screen" id="boot-screen" hidden>
    <div class="boot-content">
      <div class="boot-dots">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="boot-text">Iniciando sesión...</p>
    </div>
  </section>

  <!-- Pantalla principal -->
  <section class="screen" id="main-screen" hidden>
    <div class="main-content">
      <a class="social-btn youtube" href="https://www.youtube.com/@maxjhon22" target="_blank" rel="noopener noreferrer">
        <svg viewBox="0 0 24 24" class="social-icon">
          <path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.5 12 3.5 12 3.5s-7.5 0-9.4.6A3 3 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.6 9.4.6 9.4.6s7.5 0 9.4-.6a3 3 0 0 0 2.1-2.1A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8ZM9.6 15.6V8.4l6.3 3.6-6.3 3.6Z"/>
        </svg>
      </a>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
