<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxTest</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background-color: #000000;
    height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;
    gap: 32px;
  }

  h1 {
    color: #ffffff;
    font-size: 48px;
    letter-spacing: 2px;
  }

  .youtube-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background-color: #FF0000;
    color: #ffffff;
    text-decoration: none;
    font-weight: bold;
    font-size: 18px;
    padding: 14px 28px;
    border-radius: 8px;
    transition: transform 0.2s ease, background-color 0.2s ease;
  }

  .youtube-btn:hover {
    background-color: #cc0000;
    transform: scale(1.05);
  }

  .youtube-btn svg {
    width: 22px;
    height: 22px;
    fill: #ffffff;
  }
</style>
</head>
