<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MaxJhon22</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Capa de fondo (parallax) -->
  <div class="bg-layer" id="bgLayer"></div>

  <!-- Pantalla de inicio de sesión -->
  <section class="screen" id="login-screen">
    <div class="login-card">
      <div class="avatar-ring">
        <img src="assets/perfil.png" alt="Perfil" class="avatar">
      </div>
      <p class="username">MaxJhon22</p>
      <button class="login-btn" id="loginBtn">
        <span>Iniciar sesión</span>
        <svg viewBox="0 0 24 24" class="btn-arrow">
          <path d="M13 5l7 7-7 7M5 12h15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
    </div>
  </section>

  <!-- Pantalla de carga (boot) -->
  <section class="screen" id="boot-screen" hidden>
    <div class="boot-content">
      <div class="boot-dots">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="boot-text">Iniciando sesión...</p>
    </div>
  </section>

  <!-- Pantalla de apagado (logout) -->
  <section class="screen" id="shutdown-screen" hidden>
    <div class="boot-content">
      <div class="boot-dots">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <p class="boot-text">Cerrando sesión...</p>
    </div>
  </section>

  <!-- Pantalla principal -->
  <section class="screen" id="main-screen" hidden>

    <!-- Íconos de escritorio decorativos -->
    <div class="desktop-icons">
      <button class="desktop-icon" data-title="Sobre mí" data-content="<p>¡Hola! Soy MaxJhon22 — streamer y creador de contenido.</p><p>Esta página está en construcción, pronto más cosas por aquí.</p>">
        <span class="desktop-icon-glyph">🙂</span>
        <span class="desktop-icon-label">Sobre mí</span>
      </button>
      <button class="desktop-icon" data-title="Horarios" data-content="<p>Horario de transmisiones:</p><p>Próximamente.</p>">
        <span class="desktop-icon-glyph">🗓️</span>
        <span class="desktop-icon-label">Horarios</span>
      </button>
      <button class="desktop-icon" data-title="Papelera" data-content="<p>La papelera está vacía.</p>">
        <span class="desktop-icon-glyph">🗑️</span>
        <span class="desktop-icon-label">Papelera</span>
      </button>
    </div>

    <!-- Redes sociales -->
    <div class="social-links">
      <a class="social-btn youtube-main" href="https://www.youtube.com/@maxjhon22" target="_blank" rel="noopener noreferrer" aria-label="YouTube principal">
        <svg viewBox="0 0 24 24" class="social-icon"><path d="M21.6 7.2c-.25-1-1-1.7-1.95-1.95C17.9 4.75 12 4.75 12 4.75s-5.9 0-7.65.5C3.4 5.5 2.65 6.2 2.4 7.2 1.9 9 1.9 12 1.9 12s0 3 .5 4.8c.25 1 1 1.7 1.95 1.95 1.75.5 7.65.5 7.65.5s5.9 0 7.65-.5c.95-.25 1.7-.95 1.95-1.95.5-1.8.5-4.8.5-4.8s0-3-.5-4.8ZM9.9 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg>
      </a>

      <a class="social-btn youtube-secondary" href="https://www.youtube.com/@maxresubidos" target="_blank" rel="noopener noreferrer" aria-label="YouTube segundo canal">
        <span class="icon-wrap">
          <svg viewBox="0 0 24 24" class="social-icon"><path d="M21.6 7.2c-.25-1-1-1.7-1.95-1.95C17.9 4.75 12 4.75 12 4.75s-5.9 0-7.65.5C3.4 5.5 2.65 6.2 2.4 7.2 1.9 9 1.9 12 1.9 12s0 3 .5 4.8c.25 1 1 1.7 1.95 1.95 1.75.5 7.65.5 7.65.5s5.9 0 7.65-.5c.95-.25 1.7-.95 1.95-1.95.5-1.8.5-4.8.5-4.8s0-3-.5-4.8ZM9.9 15.3V8.7l5.7 3.3-5.7 3.3Z"/></svg>
          <span class="glyph-2">2</span>
        </span>
      </a>

      <a class="social-btn kick" href="https://kick.com/maxjhon22" target="_blank" rel="noopener noreferrer" aria-label="Kick">
        <span class="glyph">K</span>
      </a>

      <a class="social-btn x" href="https://x.com/MaxaPan22" target="_blank" rel="noopener noreferrer" aria-label="X">
        <svg viewBox="0 0 24 24" class="social-icon"><path d="M17.5 3h3l-7.4 8.4L21.9 21h-6.8l-5.3-6.9L3.7 21H.7l7.9-9L.9 3h7l4.8 6.3L17.5 3Zm-1.2 16.1h1.7L7.8 4.8H6l10.3 14.3Z"/></svg>
      </a>

      <a class="social-btn tiktok" href="https://www.tiktok.com/@maxjhon22" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <svg viewBox="0 0 24 24" class="social-icon"><path d="M16.6 5.8c-.9-.9-1.4-2.1-1.5-3.4h-3.2v13.3c0 1.5-1.2 2.7-2.7 2.7-1.5 0-2.7-1.2-2.7-2.7 0-1.5 1.2-2.7 2.7-2.7.3 0 .6.05.9.14v-3.3c-.3-.04-.6-.07-.9-.07-3.2 0-5.9 2.6-5.9 5.9 0 3.2 2.6 5.9 5.9 5.9 3.2 0 5.9-2.6 5.9-5.9V9.2c1.2.9 2.7 1.4 4.3 1.4V7.4c-1 0-1.9-.3-2.8-.9-.3-.2-.6-.5-.9-.7Z"/></svg>
      </a>
    </div>

    <!-- Panel de notificaciones (stream + último video) -->
    <div class="notif-panel" id="notifPanel" hidden>
      <span class="notif-title">En vivo</span>
      <div class="notif-card stream-card">
        <iframe src="https://player.kick.com/maxjhon22" title="Stream en vivo" allowfullscreen loading="lazy"></iframe>
      </div>
      <span class="notif-title">Último video</span>
      <div class="notif-card video-card">
        <p>No hay videos subidos</p>
      </div>
    </div>

    <!-- Mini calendario -->
    <div class="calendar-popup" id="calendarPopup" hidden></div>

    <!-- Taskbar -->
    <div class="taskbar">
      <div class="taskbar-left">
        <div class="taskbar-avatar"><img src="assets/perfil.png" alt="Perfil"></div>
      </div>

      <div class="taskbar-right">
        <button class="tray-btn" id="muteBtn" aria-label="Silenciar sonido" title="Silenciar sonido">
          <svg viewBox="0 0 24 24" id="muteIcon"><path d="M3 10v4h4l5 5V5L7 10H3Zm13.5 2A4.5 4.5 0 0 0 14 7.97v8.05A4.5 4.5 0 0 0 16.5 12Z" fill="currentColor"/></svg>
        </button>

        <button class="tray-btn" id="notifBtn" aria-label="Notificaciones" title="Notificaciones">
          <svg viewBox="0 0 24 24"><path d="M12 22a2.2 2.2 0 0 0 2.2-2.2H9.8A2.2 2.2 0 0 0 12 22Zm7-6v-5c0-3.3-1.8-6-5-6.7V3.5a2 2 0 1 0-4 0v.8C6.8 5 5 7.7 5 11v5l-2 2v1h18v-1l-2-2Z" fill="currentColor"/></svg>
        </button>

        <button class="taskbar-clock" id="clockBtn">00:00</button>

        <button class="tray-btn power-btn" id="powerBtn" aria-label="Cerrar sesión" title="Cerrar sesión">
          <svg viewBox="0 0 24 24"><path d="M13 3h-2v10h2V3Zm4.8 2.2-1.4 1.4A6.98 6.98 0 0 1 19 12a7 7 0 1 1-11.8-5.4L5.8 5.2A9 9 0 1 0 17.8 5.2Z" fill="currentColor"/></svg>
        </button>
      </div>
    </div>

  </section>

  <!-- Ventana de información (íconos de escritorio) -->
  <div class="info-overlay" id="infoOverlay" hidden>
    <div class="info-window">
      <div class="info-titlebar">
        <span class="info-title" id="infoTitle">Título</span>
        <button class="info-close" id="infoClose">✕</button>
      </div>
      <div class="info-body" id="infoBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
